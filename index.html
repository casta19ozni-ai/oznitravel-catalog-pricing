<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OZNITRAVEL">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              ozni: {
                gold: '#D4AF37',
                dark: '#1A1A1A',
                navy: '#0A2342',
                cream: '#F5F5F0',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F5F5F0;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      .luxury-gradient {
        background: linear-gradient(135deg, #0A2342 0%, #1A1A1A 100%);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1A1A1A;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #D4AF37;
      }
      /* AI Studio Blur Effect */
      .backdrop-blur-2xl {
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // Usamos createElement para que funcione directo en el navegador sin romper nada
      const e = React.createElement;

      function App() {
        return e('div', { className: "min-h-screen flex flex-col items-center justify-center p-6 bg-ozni-cream" },
          e('header', { className: "text-center mb-12 animate-scale-in" },
            e('h1', { className: "font-serif text-6xl md:text-8xl text-ozni-navy tracking-tight mb-2" }, "OZNITRAVEL"),
            e('p', { className: "font-sans text-ozni-gold tracking-[0.4em] uppercase text-xs md:text-sm font-semibold" }, "Revelamos el viaje que mereces"),
            e('div', { className: "h-[1px] w-32 bg-ozni-gold/50 mx-auto mt-8" })
          ),
          e('main', { className: "max-w-2xl w-full bg-white p-12 md:p-20 rounded shadow-2xl border border-ozni-gold/10 text-center animate-fade-in" },
            e('p', { className: "text-ozni-dark font-sans text-lg md:text-xl leading-relaxed font-light mb-12" }, 
              "Estamos preparando una experiencia de viaje inigualable. Nuestra plataforma de IA está conectando los destinos más exclusivos para ti."
            ),
            e('button', { className: "bg-ozni-navy text-ozni-gold px-12 py-4 rounded-full font-bold tracking-widest text-xs hover:bg-ozni-dark transition-all duration-500 border border-ozni-gold" }, 
              "PRÓXIMAMENTE"
            )
          )
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(e(App));
    </script>
  </body>
</html>
