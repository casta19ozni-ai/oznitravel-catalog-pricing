<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Montserrat', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
            colors: { ozni: { gold: '#D4AF37', dark: '#1A1A1A', navy: '#0A2342', cream: '#F5F5F0' } },
            animation: { 'fade-in': 'fadeIn 0.6s ease-out forwards' },
            keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } } }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0A2342; overflow-x: hidden; color: white; }
      .hero-bg {
        background: linear-gradient(rgba(10,35,66,0.7), rgba(26,26,26,0.8)), 
                    url('https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&q=80&w=1920');
        background-size: cover; background-position: center;
      }
      .backdrop-blur-2xl { backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';

      const h = React.createElement;

      function App() {
        const [view, setView] = useState('home');

        // VISTA: CATÁLOGO (Lo que aparece en tus fotos de AI Studio)
        if (view === 'catalog') {
          return h('div', { className: "min-h-screen bg-ozni-navy p-6 md:p-12 animate-fade-in" },
            h('button', { onClick: () => setView('home'), className: "text-ozni-gold mb-8 flex items-center gap-2" }, "← VOLVER AL INICIO"),
            h('h2', { className: "font-serif text-4xl md:text-6xl mb-4" }, "Membresía Global Travorium"),
            h('p', { className: "text-white/70 mb-12 text-lg" }, "Acceso mayorista con ahorros de hasta el 70%."),
            
            h('div', { className: "grid md:grid-cols-3 gap-8" },
              [
                { title: 'Membresía', icon: '🌐', label: 'AHORRO MAYORISTA' },
                { title: 'Grupos VIP', icon: '🎓', label: 'GRADUACIONES 2025' },
                { title: 'Crew Shore', icon: '⚓', label: 'RUTA GUAYAQUIL' }
              ].map(item => h('div', { 
                key: item.title,
                className: "bg-white/5 border border-white/10 p-10 text-center hover:border-ozni-gold transition-all cursor-pointer",
                onClick: () => setView('elite')
              },
                h('div', { className: "text-4xl mb-4" }, item.icon),
                h('div', { className: "text-ozni-gold text-[10px] font-black tracking-widest mb-2" }, item.label),
                h('h3', { className: "font-serif text-2xl mb-4" }, item.title),
                h('button', { className: "text-xs border border-ozni-gold text-ozni-gold px-4 py-2" }, "REVELAR BENEFICIOS")
              ))
            )
          );
        }

        // VISTA: ELITE ($269.95)
        if (view === 'elite') {
          return h('div', { className: "min-h-screen flex flex-col md:flex-row animate-fade-in" },
            h('div', { className: "md:w-1/2 bg-cover bg-center h-64 md:h-auto", style: { backgroundImage: "url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000')" } }),
            h('div', { className: "md:w-1/2 p-12 flex flex-col justify-center bg-ozni-navy" },
              h('button', { onClick: () => setView('catalog'), className: "text-ozni-gold mb-8 self-start" }, "← VOLVER AL CATÁLOGO"),
              h('h2', { className: "font-serif text-6xl mb-6 italic" }, "Elite"),
              h('div', { className: "bg-white/5 p-8 border-l-4 border-ozni-gold mb-8" },
                h('p', { className: "text-ozni-gold text-xs font-black mb-2" }, "DETALLE DE INVERSIÓN:"),
                h('p', { className: "text-4xl font-bold mb-1" }, "REGISTRO: $269.95"),
                h('p', { className: "text-xl opacity-60" }, "| CUOTA MES: $135")
              ),
              h('p', { className: "italic text-white/80 leading-relaxed mb-10 text-lg" }, 
                "\"El nivel máximo de membresía diseñado para viajeros que buscan el mayor retorno de inversión.\""
              ),
              h('button', { className: "bg-ozni-gold text-ozni-navy py-5 font-black tracking-widest text-sm hover:bg-white transition-all" }, "ACTIVAR MI MEMBRESÍA ELITE")
            )
          );
        }

        // VISTA: HOME (Hero)
        return h('div', { className: "min-h-screen hero-bg flex flex-col relative" },
          h('nav', { className: "flex justify-between items-center p-8 z-10" },
            h('div', { className: "font-serif text-2xl font-bold tracking-tighter" }, "OZNITRAVEL"),
            h('button', { className: "bg-ozni-gold text-ozni-navy px-6 py-2 font-black text-[10px] tracking-tighter" }, "RESERVAR AHORA")
          ),
          h('main', { className: "flex-grow flex flex-col items-center justify-center text-center px-6 z-10" },
            h('h1', { className: "font-serif text-7xl md:text-[140px] leading-none mb-4 tracking-tighter" }, "OZNITRAVEL"),
            h('p', { className: "font-serif italic text-xl md:text-3xl opacity-90 mb-12" }, "\"Revelamos el viaje que mereces.\""),
            h('div', { className: "flex flex-col md:flex-row gap-4 w-full max-w-2xl" },
              h('button', { 
                onClick: () => setView('catalog'),
                className: "flex-1 bg-ozni-gold text-ozni-navy py-5 font-black tracking-widest text-xs" 
              }, "CONFIGURAR EXPERIENCIA VIP"),
              h('button', { className: "flex-1 border border-white/30 backdrop-blur-md py-5 font-black tracking-widest text-xs hover:bg-white/10" }, "EXPLORAR SERVICIOS")
            )
          )
        );
      }

      createRoot(document.getElementById('root')).render(h(App));
    </script>
</body>
</html>
