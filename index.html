<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OZNITRAVEL | Revelamos el viaje que mereces</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A2342">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OZNITRAVEL">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            ozni: {
              gold: '#D4AF37',
              dark: '#1A1A1A',
              navy: '#0A2342',
              cream: '#F5F5F0',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out forwards',
            'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F5F5F0;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }
    .luxury-gradient {
      background: linear-gradient(135deg, #0A2342 0%, #1A1A1A 100%);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- ✅ ÚNICO entry point válido en Vite -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
