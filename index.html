<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              ozni: { gold: '#D4AF37', dark: '#1A1A1A', navy: '#0A2342', cream: '#F5F5F0' }
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              scaleIn: { '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' }, '100%': { opacity: '1', transform: 'scale(1) translateY(0)' } }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0A2342; scroll-behavior: smooth; overflow-x: hidden; color: white; }
      .hero-bg {
        background: linear-gradient(rgba(10,35,66,0.7), rgba(10,35,66,0.8)), 
                    url('https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=1920&q=80');
        background-size: cover; background-position: center;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF37; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';

      const e = React.createElement;

      function App() {
        const [view, setView] = useState('home');

        // Función para manejar las interacciones que antes no hacían nada
        const handleNavigation = (targetView) => {
          console.log("Navegando a:", targetView);
          setView(targetView);
        };

        // --- COMPONENTE: HOME ---
        const HomeView = () => e('div', { className: "min-h-screen hero-bg flex flex-col animate-fade-in" },
          e('nav', { className: "flex justify-between items-center p-8" },
            e('div', { className: "text-2xl font-serif font-bold tracking-tighter" }, "OZNITRAVEL"),
            e('button', { 
              className: "bg-ozni-gold text-ozni-navy px-6 py-2 font-black text-[10px] tracking-widest",
              onClick: () => handleNavigation('catalog') 
            }, "RESERVAR AHORA")
          ),
          e('main', { className: "flex-grow flex flex-col items-center justify-center text-center px-6" },
            e('h1', { className: "font-serif text-7xl md:text-[120px] mb-4 tracking-tighter animate-scale-in" }, "OZNITRAVEL"),
            e('p', { className: "font-serif italic text-xl md:text-3xl mb-12 opacity-90" }, "\"Revelamos el viaje que mereces.\""),
            e('div', { className: "flex flex-col md:flex-row gap-4 w-full max-w-2xl" },
              e('button', { 
                onClick: () => handleNavigation('catalog'),
                className: "flex-1 bg-ozni-gold text-ozni-navy py-5 font-black tracking-widest text-xs transition-transform active:scale-95" 
              }, "CONFIGURAR EXPERIENCIA VIP"),
              e('button', { 
                className: "flex-1 border border-white/30 backdrop-blur-md py-5 font-black tracking-widest text-xs hover:bg-white/10" 
              }, "EXPLORAR SERVICIOS")
            )
          )
        );

        // --- COMPONENTE: CATÁLOGO ---
        const CatalogView = () => e('div', { className: "min-h-screen bg-ozni-navy p-8 animate-fade-in custom-scrollbar overflow-y-auto" },
          e('button', { onClick: () => setView('home'), className: "text-ozni-gold mb-8 flex items-center gap-2 font-bold" }, "← VOLVER"),
          e('h2', { className: "font-serif text-5xl mb-4" }, "Membresía Global Travorium"),
          e('p', { className: "text-white/60 mb-12 max-w-2xl" }, "Ahorros de hasta el 70% en hoteles. Inversión inteligente en estilo de vida."),
          
          e('div', { className: "grid md:grid-cols-3 gap-6" },
            [
              { title: 'Membresía', label: 'AHORRO MAYORISTA', icon: '🌐' },
              { title: 'Grupos VIP', label: 'GRADUACIONES 2025', icon: '🎓' },
              { title: 'Crew Shore', label: 'RUTA GUAYAQUIL', icon: '⚓' }
            ].map((item) => e('div', { 
              key: item.title,
              className: "bg-white/5 border border-white/10 p-10 text-center hover:border-ozni-gold transition-all group cursor-pointer",
              onClick: () => setView('elite')
            },
              e('div', { className: "text-4xl mb-4" }, item.icon),
              e('div', { className: "text-ozni-gold text-[10px] font-black tracking-widest mb-2" }, item.label),
              e('h3', { className: "font-serif text-2xl mb-6" }, item.title),
              e('button', { className: "text-xs border border-ozni-gold text-ozni-gold px-6 py-2 group-hover:bg-ozni-gold group-hover:text-ozni-navy transition-colors" }, "VER DETALLES")
            ))
          )
        );

        // --- COMPONENTE: DETALLE ELITE ---
        const EliteView = () => e('div', { className: "min-h-screen flex flex-col md:flex-row animate-fade-in" },
           e('div', { className: "md:w-1/2 bg-cover bg-center h-64 md:h-auto", style: { backgroundImage: "url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&q=80&w=1000')" } }),
           e('div', { className: "md:w-1/2 p-12 flex flex-col justify-center bg-ozni-navy" },
              e('button', { onClick: () => setView('catalog'), className: "text-ozni-gold mb-8 self-start" }, "← VOLVER AL CATÁLOGO"),
              e('h2', { className: "font-serif text-7xl mb-6 italic" }, "Elite"),
              e('div', { className: "bg-white/5 p-8 border-l-4 border-ozni-gold mb-8" },
                e('p', { className: "text-ozni-gold text-xs font-black tracking-widest mb-2" }, "DETALLE DE INVERSIÓN:"),
                e('p', { className: "text-4xl font-bold" }, "REGISTRO: $269.95"),
                e('p', { className: "text-xl opacity-50" }, "| CUOTA MES: $135")
              ),
              e('button', { className: "bg-ozni-gold text-ozni-navy py-5 font-black tracking-widest text-sm" }, "ACTIVAR MI MEMBRESÍA ELITE")
           )
        );

        // Renderizado condicional basado en el estado
        if (view === 'catalog') return CatalogView();
        if (view === 'elite') return EliteView();
        return HomeView();
      }

      const root = createRoot(document.getElementById('root'));
      root.render(e(App));
    </script>
</body>
</html>
