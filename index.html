<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Montserrat', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
            colors: { ozni: { gold: '#D4AF37', dark: '#1A1A1A', navy: '#0A2342', cream: '#F5F5F0' } },
            animation: { 'fade-in': 'fadeIn 0.6s ease-out forwards', 'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards' },
            keyframes: { 
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              scaleIn: { '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' }, '100%': { opacity: '1', transform: 'scale(1) translateY(0)' } }
            }
          }
        }
      }
    </script>
    
    <style>
      body { background-color: #0A2342; color: white; margin: 0; overflow-x: hidden; }
      .hero-bg {
        background: linear-gradient(rgba(10,35,66,0.7), rgba(10,35,66,0.9)), 
                    url('https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=1920&q=80');
        background-size: cover; background-position: center; min-height: 100vh;
      }
      .backdrop-blur-2xl { backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); }
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF37; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';

      const h = React.createElement;

      function App() {
        const [activeModal, setActiveModal] = useState(null);

        // --- VENTANA EMERGENTE: CONFIGURACIÓN VIP (ELITE) ---
        const VIPModal = () => h('div', { className: "fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl animate-fade-in" },
          h('div', { className: "bg-ozni-navy border border-ozni-gold/40 w-full max-w-4xl flex flex-col md:flex-row overflow-hidden shadow-2xl animate-scale-in" },
            h('div', { className: "md:w-1/2 h-64 md:h-auto bg-cover bg-center", style: { backgroundImage: "url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&q=80')" } }),
            h('div', { className: "md:w-1/2 p-10 relative" },
              h('button', { onClick: () => setActiveModal(null), className: "absolute top-4 right-6 text-ozni-gold text-2xl" }, "✕"),
              h('h2', { className: "font-serif text-5xl mb-2 italic" }, "Elite"),
              h('p', { className: "text-ozni-gold text-[10px] font-black tracking-[0.4em] mb-8" }, "MEMBRESÍA VIP"),
              h('div', { className: "bg-white/5 p-6 border-l-2 border-ozni-gold mb-8" },
                h('p', { className: "text-3xl font-bold mb-1" }, "REGISTRO: $269.95"),
                h('p', { className: "text-lg opacity-50" }, "Mantenimiento: $135 / mes")
              ),
              h('p', { className: "text-white/70 italic mb-10 leading-relaxed" }, 
                "\"El nivel máximo de ahorro mayorista. Diseñado para quienes no aceptan menos que la excelencia en cada destino.\""
              ),
              h('button', { className: "w-full bg-ozni-gold text-ozni-navy py-4 font-black tracking-widest text-xs uppercase" }, "CONFIRMAR ACCESO VIP")
            )
          )
        );

        // --- VENTANA EMERGENTE: CATÁLOGO DE SERVICIOS ---
        const CatalogModal = () => h('div', { className: "fixed inset-0 z-[100] bg-ozni-navy p-6 md:p-20 overflow-y-auto animate-fade-in custom-scrollbar" },
          h('div', { className: "max-w-7xl mx-auto" },
            h('button', { onClick: () => setActiveModal(null), className: "text-ozni-gold mb-12 flex items-center gap-2 font-bold tracking-widest" }, "← CERRAR"),
            h('h2', { className: "font-serif text-6xl mb-4 italic" }, "Membresía Global Travorium"),
            h('p', { className: "text-white/50 mb-16 text-xl max-w-3xl" }, "Acceso exclusivo a tarifas mayoristas con ahorros de hasta el 70% en hoteles de 5 estrellas."),
            h('div', { className: "grid md:grid-cols-3 gap-8" },
              [
                { id: 'vip', title: 'Membresía', icon: '🌐', label: 'AHORRO MAYORISTA' },
                { id: 'vip', title: 'Grupos VIP', icon: '🎓', label: 'GRADUACIONES 2025' },
                { id: 'vip', title: 'Crew Shore', icon: '⚓', label: 'RUTA GUAYAQUIL' }
              ].map(item => h('div', { 
                key: item.title,
                className: "bg-white/5 border border-white/10 p-12 text-center hover:border-ozni-gold transition-all cursor-pointer group",
                onClick: () => setActiveModal('vip')
              },
                h('div', { className: "text-5xl mb-6" }, item.icon),
                h('div', { className: "text-ozni-gold text-[10px] font-black tracking-widest mb-4 opacity-70 group-hover:opacity-100" }, item.label),
                h('h3', { className: "font-serif text-3xl mb-8" }, item.title),
                h('button', { className: "text-[10px] border border-ozni-gold text-ozni-gold px-8 py-3 tracking-widest uppercase group-hover:bg-ozni-gold group-hover:text-ozni-navy" }, "REVELAR BENEFICIOS")
              ))
            )
          )
        );

        // --- VISTA PRINCIPAL (HERO) ---
        return h('div', { className: "hero-bg flex flex-col relative" },
          h('nav', { className: "flex justify-between items-center p-8 z-10" },
            h('div', { className: "font-serif text-2xl font-bold tracking-tighter" }, "OZNITRAVEL"),
            h('button', { className: "bg-ozni-gold text-ozni-navy px-6 py-2 font-black text-[10px] tracking-tighter" }, "RESERVAR AHORA")
          ),
          h('main', { className: "flex-grow flex flex-col items-center justify-center text-center px-6 z-10" },
            h('h1', { className: "font-serif text-7xl md:text-[150px] leading-none mb-4 tracking-tighter animate-scale-in" }, "OZNITRAVEL"),
            h('p', { className: "font-serif italic text-xl md:text-3xl opacity-90 mb-16" }, "\"Revelamos el viaje que mereces.\""),
            h('div', { className: "flex flex-col md:flex-row gap-6 w-full max-w-3xl" },
              h('button', { 
                onClick: () => setActiveModal('vip'),
                className: "flex-1 bg-ozni-gold text-ozni-navy py-6 font-black tracking-[0.2em] text-xs uppercase shadow-xl active:scale-95 transition-all" 
              }, "CONFIGURAR EXPERIENCIA VIP"),
              h('button', { 
                onClick: () => setActiveModal('catalog'),
                className: "flex-1 border border-white/30 backdrop-blur-md py-6 font-black tracking-[0.2em] text-xs uppercase hover:bg-white/10 transition-all" 
              }, "EXPLORAR SERVICIOS")
            )
          ),
          
          activeModal === 'vip' && VIPModal(),
          activeModal === 'catalog' && CatalogModal()
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(h(App));
    </script>
</body>
</html>
