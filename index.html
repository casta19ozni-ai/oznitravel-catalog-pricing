<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OZNITRAVEL">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              ozni: {
                gold: '#D4AF37',
                dark: '#1A1A1A',
                navy: '#0A2342',
                cream: '#F5F5F0',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #F5F5F0; scroll-behavior: smooth; overflow-x: hidden; }
      .luxury-gradient { background: linear-gradient(135deg, #0A2342 0%, #1A1A1A 100%); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Usamos React sin JSX para que Vercel no de error de pantalla en blanco
      const e = React.createElement;

      function App() {
        return e('div', { className: "min-h-screen flex flex-col items-center justify-center bg-[#F5F5F0] p-4 font-sans" },
          // Encabezado
          e('header', { className: "text-center mb-8 animate-scale-in" },
            e('h1', { className: "font-serif text-[60px] md:text-[100px] leading-none text-[#0A2342] mb-4 uppercase" }, "OZNITRAVEL"),
            e('p', { className: "text-[#D4AF37] tracking-[0.4em] uppercase text-xs md:text-sm font-bold" }, "Revelamos el viaje que mereces"),
            e('div', { className: "h-[1.5px] w-24 bg-[#D4AF37] mx-auto mt-8" })
          ),
          // Cuadro de texto (Copia exacta de tu imagen)
          e('main', { className: "max-w-[700px] w-full bg-white p-12 md:p-16 rounded-lg shadow-[0_20px_60px_rgba(0,0,0,0.08)] border border-gray-100 text-center animate-fade-in" },
            e('p', { className: "text-[#1A1A1A] text-lg md:text-xl leading-relaxed mb-10 font-normal px-4" }, 
              "Estamos preparando una experiencia de viaje inigualable. Nuestra plataforma de IA está conectando los destinos más exclusivos para ti."
            ),
            e('button', { className: "bg-[#0A2342] text-[#D4AF37] px-14 py-4 rounded-full font-bold tracking-widest text-sm hover:brightness-110 transition-all border border-[#D4AF37] uppercase" }, 
              "Próximamente"
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(App));
    </script>
  </body>
</html>
