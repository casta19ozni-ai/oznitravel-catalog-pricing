<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZNITRAVEL | Revelamos el viaje que mereces</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3125/3125848.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              ozni: { gold: '#D4AF37', dark: '#1A1A1A', navy: '#0A2342', cream: '#F5F5F0' }
            }
          }
        }
      }
    </script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      .hero-bg {
        background: linear-gradient(rgba(10, 35, 66, 0.7), rgba(26, 26, 26, 0.8)), 
                    url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&q=80&w=1920');
        background-size: cover;
        background-position: center;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';

      const e = React.createElement;

      function App() {
        // Lógica de interacción
        const handleAction = (tipo) => {
          console.log(`Acción ejecutada: ${tipo}`);
          alert(`Iniciando: ${tipo}. Estamos conectando con el concierge VIP...`);
        };

        return e('div', { className: "relative min-h-screen hero-bg flex flex-col font-sans" },
          // Navbar
          e('nav', { className: "relative z-10 flex justify-between items-center px-8 py-6" },
            e('div', { className: "flex items-center gap-2" },
              e('div', { className: "w-5 h-5 border border-ozni-gold rounded-full flex items-center justify-center" },
                e('div', { className: "w-1 h-1 bg-ozni-gold rounded-full" })
              ),
              e('span', { className: "text-white font-serif text-xl font-bold uppercase tracking-tighter" }, "Oznitravel")
            ),
            e('button', { 
              className: "bg-ozni-gold text-ozni-navy px-5 py-2 text-[10px] font-black tracking-widest rounded-sm active:scale-95 transition-transform",
              onClick: () => handleAction('Reserva Directa')
            }, "RESERVAR AHORA")
          ),

          // Contenido
          e('main', { className: "relative z-10 flex-grow flex flex-col items-center justify-center text-center px-4" },
            e('h1', { className: "text-white font-serif text-6xl md:text-[120px] leading-none mb-4 tracking-tighter" }, "OZNITRAVEL"),
            e('p', { className: "text-white font-serif italic text-lg md:text-3xl opacity-90 mb-12" }, "\"Revelamos el viaje que mereces.\""),
            
            e('div', { className: "flex flex-col md:flex-row gap-4 w-full max-w-2xl" },
              e('button', { 
                className: "flex-1 bg-ozni-gold text-ozni-navy py-5 font-bold tracking-[0.2em] text-xs active:brightness-125 transition-all",
                onClick: () => handleAction('Configurador VIP')
              }, "CONFIGURAR EXPERIENCIA VIP"),
              
              e('button', { 
                className: "flex-1 border border-white/30 text-white backdrop-blur-md py-5 font-bold tracking-[0.2em] text-xs hover:bg-white/10 active:scale-95 transition-all",
                onClick: () => handleAction('Catálogo de Servicios')
              }, "EXPLORAR SERVICIOS")
            )
          )
        );
      }

      createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
