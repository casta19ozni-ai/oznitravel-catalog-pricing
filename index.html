<script type="module">
    // CONFIG & DATA
    const CONTACT = "593983977320";
    
    // DATA ARRAYS
    const MEM_BENEFITS = [
        { title: "Platinum Equity", desc: "Inversión: $269.95. Puntos: 270/mes.", price: "Elite" },
        { title: "Titanium Flex", desc: "Inversión: $149.95. Puntos: 150/mes.", price: "Preferido" },
        { title: "Tarifas Netas", desc: "Acceso mayorista sin comisiones.", price: "Directo" },
        { title: "Escapadas $1", desc: "Canje de puntos por estancias.", price: "VIP" }
    ];

    const TOOLKIT = [
        { n: "Vuelos", u: "https://www.kiwi.com/es/", i: "✈️" },
        { n: "Movilidad", u: "https://localrent.com/", i: "🚗" },
        { n: "eSIM", u: "https://yesim.app/", i: "📶" },
        { n: "Tickets", u: "https://www.tiqets.com/", i: "🎟️" }
    ];

    // UI FUNCTIONS (Globales para que el HTML las vea)
    window.scrollToSection = (id) => {
        const el = document.getElementById(id);
        if(el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
    };

    window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
    window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

    window.handleWhatsAppNav = (text = "Hola OZNITRAVEL, deseo diseñar una experiencia VIP.") => {
        window.open(`https://wa.me/${CONTACT}?text=${encodeURIComponent(text)}`, '_blank');
    };

    // GENERAR CONTENIDO DINÁMICO
    const initUI = () => {
        const memGrid = document.getElementById('membership-grid');
        if(memGrid) {
            memGrid.innerHTML = MEM_BENEFITS.map(b => `
                <div class="p-8 border border-white/10 bg-white/5 hover:bg-ozni-gold hover:text-ozni-navy transition-all duration-500 group">
                    <span class="text-ozni-gold group-hover:text-ozni-navy font-black text-xs uppercase tracking-widest">${b.price}</span>
                    <h4 class="text-2xl font-serif my-4">${b.title}</h4>
                    <p class="text-sm opacity-70">${b.desc}</p>
                </div>
            `).join('');
        }

        const toolkitGrid = document.getElementById('toolkit-grid');
        if(toolkitGrid) {
            toolkitGrid.innerHTML = TOOLKIT.map(t => `
                <a href="${t.u}" target="_blank" class="p-6 bg-gray-50 border hover:border-ozni-gold text-center transition-all group">
                    <span class="text-3xl block mb-2 transition-transform group-hover:scale-110">${t.i}</span>
                    <h5 class="text-[10px] font-bold uppercase tracking-widest text-ozni-navy">${t.n}</h5>
                </a>
            `).join('');
        }
    };

    // Inicializar al cargar
    document.addEventListener('DOMContentLoaded', initUI);
</script>
</body>
</html>
